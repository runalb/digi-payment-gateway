spring.application.name=digi-payment-gateway
spring.profiles.active=dev
security.jwt.expiration-seconds=3600
security.jwt.refresh-expiration-seconds=1209600
security.otp.cleanup-interval-ms=60000
security.otp.resend-cooldown-seconds=45
server.error.include-message=always

# HTTP exchange logging (inbound + outbound)
http.exchange.log.enabled=true
http.exchange.log.max-body-size=65536
http.exchange.log.log-request-headers=true
http.exchange.log.log-response-headers=false
http.exchange.log.include-error-detail=true
http.exchange.log.max-error-detail-length=8192
http.exchange.log.exclude-paths=/actuator/**,/test-checkout.html/**
